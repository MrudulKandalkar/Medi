name: Medi Appointment Automation

on:

  schedule:

    # 11:30 PM IST = 18:00 UTC
    #
    # Sunday    -> Monday    12:00 AM IST
    # Monday    -> Tuesday   12:00 AM IST
    # Tuesday   -> Wednesday 12:00 AM IST
    # Wednesday -> Thursday  12:00 AM IST
    # Thursday  -> Friday    12:00 AM IST

    - cron: '0 18 * * 0-4'

  workflow_dispatch:


jobs:

  appointment:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================
      # 2. Setup Java 25
      # ==========================================

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven


      # ==========================================
      # 3. Install Chrome + Xvfb
      # ==========================================

      - name: Install Xvfb
        run: |

          sudo apt-get update

          sudo apt-get install -y xvfb


      # ==========================================
      # 4. Start virtual display
      # ==========================================

      - name: Start Xvfb
        run: |

          Xvfb :99 \
            -screen 0 1920x1080x24 \
            -ac \
            +extension RANDR &

          echo "DISPLAY=:99" >> $GITHUB_ENV

          sleep 3


      # ==========================================
      # 5. Verify environment
      # ==========================================

      - name: Verify Environment
        run: |

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo ""
          echo "========================================"
          echo "MAVEN"
          echo "========================================"

          mvn -version

          echo ""
          echo "========================================"
          echo "CHROME"
          echo "========================================"

          google-chrome --version || true

          echo ""
          echo "========================================"
          echo "DISPLAY"
          echo "========================================"

          echo $DISPLAY

          echo ""
          echo "========================================"
          echo "TIME"
          echo "========================================"

          date -u

          echo ""

          TZ=Asia/Kolkata date


      # ==========================================
      # 6. Run TestNG
      # ==========================================

      - name: Run Appointment Tests
        run: |

          echo "========================================"
          echo "STARTING APPOINTMENT AUTOMATION"
          echo "========================================"

          mvn -B clean test -DsuiteXmlFile=testng.xml


      # ==========================================
      # 7. Upload screenshots/reports
      # ==========================================

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appointment-test-results
          path: |
            test-output/
            screenshots/
            target/surefire-reports/
          if-no-files-found: ignore
